<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="70" y="70" width="1260" height="760" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="3"/>
  <text x="700" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Document Ingestion and RAG Flow</text>
  <text x="700" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">Upload, extract, index, retrieve, answer, and cite evidence</text>

  <rect x="120" y="240" width="220" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">1. Upload</text>
  <text x="230" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">PDF / TXT / MD</text>

  <rect x="410" y="240" width="220" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d">2. Extract</text>
  <text x="520" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Text and metadata</text>

  <rect x="700" y="240" width="220" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="810" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">3. Chunk</text>
  <text x="810" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Overlapping chunks</text>

  <rect x="990" y="240" width="220" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1100" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">4. Embed</text>
  <text x="1100" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Send to Qdrant</text>

  <line x1="340" y1="300" x2="410" y2="300" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="630" y1="300" x2="700" y2="300" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="920" y1="300" x2="990" y2="300" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="300" y="470" width="260" height="140" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="430" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#be185d">5. Retrieve</text>
  <text x="430" y="554" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Nearest relevant chunks</text>

  <rect x="590" y="470" width="260" height="140" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="720" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0369a1">6. Ground</text>
  <text x="720" y="554" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Build grounded prompt</text>

  <rect x="880" y="470" width="260" height="140" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1010" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626">7. Cite</text>
  <text x="1010" y="554" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Answer with evidence</text>

  <line x1="1100" y1="360" x2="1010" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1100" y1="360" x2="720" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1100" y1="360" x2="430" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
