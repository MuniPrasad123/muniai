<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="70" y="60" width="1260" height="780" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="3"/>
  <text x="700" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">MuniAI Local Architecture</text>
  <text x="700" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">Private, local-first AI assistant running fully on the developer machine</text>

  <rect x="180" y="230" width="220" height="140" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">React UI</text>
  <text x="290" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Chat, documents,</text>
  <text x="290" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">conversation history</text>

  <rect x="590" y="230" width="220" height="140" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#15803d">Spring Boot API</text>
  <text x="700" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Conversation, docs,</text>
  <text x="700" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">RAG orchestration</text>

  <rect x="1000" y="230" width="220" height="140" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1110" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">Local Data</text>
  <text x="1110" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Files, metadata,</text>
  <text x="1110" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">and vector records</text>

  <line x1="400" y1="300" x2="590" y2="300" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="810" y1="300" x2="1000" y2="300" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="190" y="470" width="180" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="280" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">PostgreSQL</text>
  <text x="280" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Conversations</text>

  <rect x="430" y="470" width="180" height="120" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="520" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#be185d">Ollama</text>
  <text x="520" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Chat + embeddings</text>

  <rect x="670" y="470" width="180" height="120" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="760" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0369a1">Qdrant</text>
  <text x="760" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Vector search</text>

  <rect x="910" y="470" width="180" height="120" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1000" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626">Files</text>
  <text x="1000" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Original uploads</text>

  <line x1="700" y1="370" x2="280" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="370" x2="520" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="370" x2="760" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="370" x2="1000" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
