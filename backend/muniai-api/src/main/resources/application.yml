server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: muniai-api
  datasource:
    url: ${MUNIAI_DB_URL:jdbc:postgresql://127.0.0.1:5432/muniai}
    username: ${MUNIAI_DB_USERNAME:muniai}
    password: ${MUNIAI_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: ${MUNIAI_DOCUMENT_MAX_SIZE:10MB}
      max-request-size: ${MUNIAI_DOCUMENT_MAX_REQUEST_SIZE:11MB}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

muniai:
  chat:
    max-message-length: ${MUNIAI_CHAT_MAX_MESSAGE_LENGTH:10000}
  rag:
    top-k: ${RAG_TOP_K:5}
    maximum-top-k: ${RAG_MAX_TOP_K:10}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.45}
    max-context-chunks: ${RAG_MAX_CONTEXT_CHUNKS:5}
    max-context-characters: ${RAG_MAX_CONTEXT_CHARACTERS:6000}
    max-history-messages: ${RAG_MAX_HISTORY_MESSAGES:8}
    chat-model: ${RAG_CHAT_MODEL:}
    temperature: ${RAG_TEMPERATURE:0.1}
    request-timeout: ${RAG_REQUEST_TIMEOUT:300s}
  documents:
    upload-directory: ${MUNIAI_DOCUMENT_UPLOAD_DIR:../../local-data/documents}
    max-file-size: ${MUNIAI_DOCUMENT_MAX_SIZE:10MB}
  indexing:
    chunk-size: ${DOCUMENT_CHUNK_SIZE:1000}
    chunk-overlap: ${DOCUMENT_CHUNK_OVERLAP:150}
    batch-size: ${DOCUMENT_INDEX_BATCH_SIZE:8}
    embedding:
      base-url: ${OLLAMA_EMBEDDING_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}
      timeout: ${OLLAMA_EMBEDDING_TIMEOUT:120s}
      dimension: ${OLLAMA_EMBEDDING_DIMENSION:768}
    qdrant:
      host: ${QDRANT_HOST:127.0.0.1}
      http-port: ${QDRANT_HTTP_PORT:6333}
      grpc-port: ${QDRANT_GRPC_PORT:6334}
      api-key: ${QDRANT_API_KEY:}
      https-enabled: ${QDRANT_HTTPS_ENABLED:false}
      collection-name: ${QDRANT_COLLECTION_NAME:muniai_document_chunks}
      distance-metric: ${QDRANT_DISTANCE_METRIC:COSINE}
      timeout: ${QDRANT_REQUEST_TIMEOUT:30s}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${MUNIAI_CHAT_MODEL:llama3.2:3b}
    timeout: ${OLLAMA_TIMEOUT_SECONDS:300}s

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
