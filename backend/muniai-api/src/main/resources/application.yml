server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: muniai-api
  datasource:
    url: ${MUNIAI_DB_URL:jdbc:postgresql://127.0.0.1:5432/muniai}
    username: ${MUNIAI_DB_USERNAME:muniai}
    password: ${MUNIAI_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

muniai:
  chat:
    max-message-length: ${MUNIAI_CHAT_MAX_MESSAGE_LENGTH:10000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${MUNIAI_CHAT_MODEL:llama3.2:3b}
    timeout: ${OLLAMA_TIMEOUT_SECONDS:300}s

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
