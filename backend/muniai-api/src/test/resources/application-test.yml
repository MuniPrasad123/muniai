spring:
  datasource:
    url: jdbc:h2:mem:muniai-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
muniai:
  documents:
    upload-directory: ${java.io.tmpdir}/muniai-document-tests
    max-file-size: 1KB
  indexing:
    chunk-size: 80
    chunk-overlap: 20
    batch-size: 2
    embedding:
      base-url: http://127.0.0.1:11434
      model: test-embed
      timeout: 1s
      dimension: 3
    qdrant:
      host: 127.0.0.1
      http-port: 6333
      grpc-port: 6334
      api-key: ""
      https-enabled: false
      collection-name: test_chunks
      distance-metric: COSINE
      timeout: 1s
